name: CI

on:
  push:
    branches: [main]
  # Sem filtro de base: roda em PR para QUALQUER branch. Com "branches: [main]" os
  # PRs empilhados (que apontam para outra branch de feature) ficavam sem CI, e o
  # gate de testes só valia para o último PR da fila.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & publish (smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restaura app + testes de uma vez. O ClefExplorer.Package (.wapproj) é
      # ignorado com NU1503 — o CLI do dotnet não o suporta; quem o constrói é o
      # MSBuild no release.yml.
      - name: Restore
        run: dotnet restore ClefExplorer.sln

      - name: Build (Release)
        run: dotnet build src/ClefExplorer.csproj -c Release --no-restore

      - name: Test
        run: dotnet test test/ClefExplorer.Tests/ClefExplorer.Tests.csproj -c Release --no-restore

      # Publica single-file self-contained (mesmos padrões do csproj) só para
      # validar que a publicação funciona e gerar um artefato baixável.
      - name: Publish single-file (win-x64)
        run: dotnet publish src/ClefExplorer.csproj -c Release -r win-x64 --self-contained --no-restore -o artifacts/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClefExplorer-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
